name: "202608271854 · auto-run DATA_CENTRES intelligence candidate"

on:
  push:
    branches:
      - "automation/202608271854-data-centres-intelligence"
    paths:
      - ".github/workflows/202608271854-auto-run-data-centres-intelligence-candidate.yml"

permissions:
  contents: write

concurrency:
  group: data-centres-intelligence-auto-run-202608271854
  cancel-in-progress: false

env:
  GENERATION: "202608271727"
  DUCKDB_VERSION: "1.3.2"
  SOURCE_COMMIT: "7e98a64801b9d9936fd37abb1cb6fc5c4827e88e"
  SOURCE_TREE: "81b5b8c1a0861d4d9cf6a7e09923546a814a6b94"
  LAUNCHER_PATH: ".github/workflows/202608271854-auto-run-data-centres-intelligence-candidate.yml"
  LAUNCHER_REF: "refs/heads/automation/202608271854-data-centres-intelligence"
  CANDIDATE_REF: "refs/heads/candidate/202608271727"

jobs:
  build-verify-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact launcher commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Assert exact automation-branch push and one-file launcher boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "${LAUNCHER_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          read -r -a ancestry <<< "$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          test "${#ancestry[@]}" -eq 2
          test "${ancestry[1]}" = "${SOURCE_COMMIT}"
          mapfile -t actual < <(git diff --name-only --diff-filter=ACDMRTUXB "${SOURCE_COMMIT}" "${GITHUB_SHA}" | sort)
          test "${#actual[@]}" -eq 1
          test "${actual[0]}" = "${LAUNCHER_PATH}"
          test "$(git rev-parse "${SOURCE_COMMIT}^{tree}")" = "${SOURCE_TREE}"
          test -z "$(git status --porcelain=v1)"

      - name: Check out immutable 202608271727 source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${SOURCE_TREE}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned analytical engine
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"

      - name: Run source doctor, syntax checks and hostile semantic tests
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          python build/python/202608271727-build-data-centres-intelligence.py doctor --root .
          python -m py_compile \
            build/python/202608271727-build-data-centres-intelligence.py \
            build/python/202608271727-verify-data-centres-intelligence.py \
            tests/test_202608271727_data_centres_intelligence.py
          python -m unittest -v tests/test_202608271727_data_centres_intelligence.py
          test -z "$(git status --porcelain=v1)"

      - name: Compile twice from the exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-build-data-centres-intelligence.py build \
            --root . \
            --output-root "${RUNNER_TEMP}/candidate-a" \
            --source-commit "${SOURCE_COMMIT}"
          python build/python/202608271727-build-data-centres-intelligence.py build \
            --root . \
            --output-root "${RUNNER_TEMP}/candidate-b" \
            --source-commit "${SOURCE_COMMIT}"

      - name: Independently verify both closures and byte parity
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root "${RUNNER_TEMP}/candidate-a" \
            --source-root . \
            --expected-source-commit "${SOURCE_COMMIT}"
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root "${RUNNER_TEMP}/candidate-b" \
            --source-root . \
            --expected-source-commit "${SOURCE_COMMIT}"
          python build/python/202608271727-verify-data-centres-intelligence.py compare \
            --left "${RUNNER_TEMP}/candidate-a" \
            --right "${RUNNER_TEMP}/candidate-b"

      - name: Replace only the complete touched partition and land closure
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-build-data-centres-intelligence.py land \
            --candidate-root "${RUNNER_TEMP}/candidate-a" \
            --destination-root . \
            --source-commit "${SOURCE_COMMIT}"
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root . \
            --source-root . \
            --expected-source-commit "${SOURCE_COMMIT}"

      - name: Assert exact output-only closure
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "data/intelligence/generation=202608271727/section=DATA_CENTRES/part-000.parquet"
            "exports/202608271727-pipelinenews-data-centres.json"
            "reports/202608271727-data-centres-intelligence-audit.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual < <(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          if rg -a -n -i 'github_pat_|gh[pousr]_[A-Za-z0-9_]{20,}|authorization:[[:space:]]*(bearer|basic)' \
            "${expected[@]}"; then
            echo "Credential-shaped material found in candidate outputs" >&2
            exit 1
          fi

      - name: Commit only to the immutable candidate branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${CANDIDATE_REF}" >/dev/null 2>&1; then
            echo "Candidate ref already exists; immutable publication is closed" >&2
            exit 1
          fi
          expected=(
            "data/intelligence/generation=202608271727/section=DATA_CENTRES/part-000.parquet"
            "exports/202608271727-pipelinenews-data-centres.json"
            "reports/202608271727-data-centres-intelligence-audit.json"
          )
          git add -- "${expected[@]}"
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t staged < <(git diff --cached --name-only | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-08-27T17:27:00Z"
          export GIT_COMMITTER_DATE="2026-08-27T17:27:00Z"
          git commit -m "202608271727: publish quarantined DATA_CENTRES intelligence candidate"
          test "$(git rev-parse HEAD^)" = "${SOURCE_COMMIT}"
          git push --force-with-lease="${CANDIDATE_REF}:" origin "HEAD:${CANDIDATE_REF}"

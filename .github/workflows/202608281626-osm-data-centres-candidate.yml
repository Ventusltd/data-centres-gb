name: "202608281626 · retry-aware OSM data-centres candidate"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/202608281626-osm-data-centres-candidate.yml"
      - "build/python/202608281626-osm-overpass-retry.py"
      - "contracts/202608281626-osm-overpass-retry-privacy.json"
      - "tests/test_202608281626_osm_overpass_retry.py"

permissions:
  actions: read
  contents: write

concurrency:
  group: data-centres-gb-${{ github.ref }}
  cancel-in-progress: false

env:
  GENERATION: "202608281053"
  DUCKDB_VERSION: "1.3.2"
  REPAIR_GENERATION: "202608281626"
  PARENT_COMMIT: "0f4e8ac8bdb93091bbc20fcbbf65a61c851232c3"
  FAILED_RUN_ID: "33161947627"
  FAILED_JOB_ID: "98818333965"
  CANDIDATE_BRANCH: "candidate/202608281053-osm-data-centres"

jobs:
  fetch-build-verify-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}" "requests==2.32.4"

      - name: Assert main, direct parent and exact repair boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          read -r -a ancestry <<< "$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          test "${#ancestry[@]}" -eq 2
          test "${ancestry[1]}" = "${PARENT_COMMIT}"
          git diff --name-status --no-renames "${PARENT_COMMIT}" "${GITHUB_SHA}" | sort > "${RUNNER_TEMP}/actual"
          printf '%s\n' \
            $'A\t.github/workflows/202608281626-osm-data-centres-candidate.yml' \
            $'A\tbuild/python/202608281626-osm-overpass-retry.py' \
            $'A\tcontracts/202608281626-osm-overpass-retry-privacy.json' \
            $'A\ttests/test_202608281626_osm_overpass_retry.py' | sort > "${RUNNER_TEMP}/expected"
          diff -u "${RUNNER_TEMP}/expected" "${RUNNER_TEMP}/actual"
          test -z "$(git status --porcelain=v1)"

          test "$(git rev-parse HEAD:build/python/202608281053-osm-data-centres.py)" = "ef33bd6e8ce1563f51dcef5df4c56bf520aab02c"
          test "$(git rev-parse HEAD:queries/202608281053-gb-data-centres.overpassql)" = "f159dd173b5a49024bcf574266d7ec4ae7012441"
          test "$(git rev-parse HEAD:contracts/202608281053-osm-data-centres.json)" = "430a242882a7e902e6e598a4b916b08185e73ffb"
          test "$(git rev-parse HEAD:manifests/202608281053-osm-data-centres-source.json)" = "820141b97e461ae460d23ce8a9116fad909f5d57"
          test "$(git rev-parse HEAD:data/source-fixtures/202608281053-overpass-fixture.json)" = "6e21a52c04b28bf195ed1d0a02367f11b1cd7e92"
          test "$(git rev-parse HEAD:tests/test_202608281053_osm_data_centres.py)" = "9a0941cfc33ab3f4a51feeeae85bacc7a1641978"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN_ID}" > "${RUNNER_TEMP}/failed-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}" > "${RUNNER_TEMP}/failed-job.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          run = json.loads((temp / "failed-run.json").read_text(encoding="utf-8"))
          job = json.loads((temp / "failed-job.json").read_text(encoding="utf-8"))
          assert run["id"] == int(os.environ["FAILED_RUN_ID"])
          assert run["head_sha"] == os.environ["PARENT_COMMIT"]
          assert run["conclusion"] == "failure"
          assert job["id"] == int(os.environ["FAILED_JOB_ID"])
          assert job["conclusion"] == "failure"
          failed = [
              step for step in job["steps"]
              if step["name"] == "Fetch OpenStreetMap once through Overpass"
          ]
          assert len(failed) == 1 and failed[0]["conclusion"] == "failure"
          PY

          python build/python/202608281626-osm-overpass-retry.py doctor --root .

      - name: Run offline hostile fixture and retry suites
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          python -m py_compile \
            app.py \
            build/python/202608281053-osm-data-centres.py \
            build/python/202608281626-osm-overpass-retry.py \
            tests/test_202608281053_osm_data_centres.py \
            tests/test_202608281626_osm_overpass_retry.py
          python -m unittest -v \
            tests/test_202608281053_osm_data_centres.py \
            tests/test_202608281626_osm_overpass_retry.py

      - name: Fetch OpenStreetMap with three bounded envelope attempts
        id: overpass
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608281626-osm-overpass-retry.py fetch \
            --root . \
            --output "${RUNNER_TEMP}/overpass-fetch.json"
          test -s "${RUNNER_TEMP}/overpass-fetch.json"
          test ! -e "${RUNNER_TEMP}/overpass-fetch-failure.json"

      - name: Retain sanitised Overpass failure evidence
        if: failure() && steps.overpass.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overpass-fetch-failure-${{ env.REPAIR_GENERATION }}-${{ github.run_id }}
          path: ${{ runner.temp }}/overpass-fetch-failure.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Compile twice from the same retained response
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608281626-osm-overpass-retry.py build \
            --root . \
            --input "${RUNNER_TEMP}/overpass-fetch.json" \
            --output-root "${RUNNER_TEMP}/candidate-a" \
            --source-commit "${GITHUB_SHA}"
          python build/python/202608281626-osm-overpass-retry.py build \
            --root . \
            --input "${RUNNER_TEMP}/overpass-fetch.json" \
            --output-root "${RUNNER_TEMP}/candidate-b" \
            --source-commit "${GITHUB_SHA}"

      - name: Verify both closures and byte parity
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608281626-osm-overpass-retry.py verify \
            --root "${RUNNER_TEMP}/candidate-a" \
            --source-root . \
            --input "${RUNNER_TEMP}/overpass-fetch.json" \
            --expected-source-commit "${GITHUB_SHA}"
          python build/python/202608281626-osm-overpass-retry.py verify \
            --root "${RUNNER_TEMP}/candidate-b" \
            --source-root . \
            --input "${RUNNER_TEMP}/overpass-fetch.json" \
            --expected-source-commit "${GITHUB_SHA}"
          python build/python/202608281626-osm-overpass-retry.py compare \
            --left "${RUNNER_TEMP}/candidate-a" \
            --right "${RUNNER_TEMP}/candidate-b"

      - name: Land only the complete candidate closure
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608281626-osm-overpass-retry.py land \
            --candidate-root "${RUNNER_TEMP}/candidate-a" \
            --destination-root . \
            --source-commit "${GITHUB_SHA}"
          python build/python/202608281626-osm-overpass-retry.py verify \
            --root . \
            --source-root . \
            --input "${RUNNER_TEMP}/overpass-fetch.json" \
            --expected-source-commit "${GITHUB_SHA}"

      - name: Assert immutable output-only boundary
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "data/facilities/generation=202608281053/source=OPENSTREETMAP/osm-data-centre-elements-v1.parquet"
            "data/relationships/generation=202608281053/data-centre-company-relationships-v1.parquet"
            "exports/202608281053-osm-data-centres.geojson"
            "reports/202608281053-osm-data-centres-audit.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual < <(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit immutable quarantined candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            data/facilities/generation=202608281053/source=OPENSTREETMAP/osm-data-centre-elements-v1.parquet \
            data/relationships/generation=202608281053/data-centre-company-relationships-v1.parquet \
            exports/202608281053-osm-data-centres.geojson \
            reports/202608281053-osm-data-centres-audit.json
          expected=(
            "data/facilities/generation=202608281053/source=OPENSTREETMAP/osm-data-centre-elements-v1.parquet"
            "data/relationships/generation=202608281053/data-centre-company-relationships-v1.parquet"
            "exports/202608281053-osm-data-centres.geojson"
            "reports/202608281053-osm-data-centres-audit.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t staged < <(git diff --cached --name-only | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-08-28T09:53:00Z"
          export GIT_COMMITTER_DATE="2026-08-28T09:53:00Z"
          git commit -m "202608281053: publish quarantined OSM data-centres candidate"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

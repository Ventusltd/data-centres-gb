name: "202608271727 · DATA_CENTRES intelligence candidate"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-centres-intelligence-202608271727
  cancel-in-progress: false

env:
  GENERATION: "202608271727"
  DUCKDB_VERSION: "1.3.2"
  CANDIDATE_BRANCH: "candidate/202608271727"
  PARENT_COMMIT: "0939e3c735f4c9cacefb3acad00b35b6e07e62c2"

jobs:
  build-verify-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned analytical engine
        run: python -m pip install --disable-pip-version-check "duckdb==${DUCKDB_VERSION}"

      - name: Assert main, exact parent and exact seven-file source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          read -r -a ancestry <<< "$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          test "${#ancestry[@]}" -eq 2
          test "${ancestry[1]}" = "${PARENT_COMMIT}"
          expected=(
            ".github/workflows/202608271727-data-centres-intelligence-candidate.yml"
            "build/python/202608271727-build-data-centres-intelligence.py"
            "build/python/202608271727-verify-data-centres-intelligence.py"
            "contracts/202608271727-data-centres-intelligence.json"
            "data/source-fixtures/202608271727-repository-context.json"
            "manifests/202608271727-data-centres-intelligence-source.json"
            "tests/test_202608271727_data_centres_intelligence.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          mapfile -t actual < <(git diff --name-only --diff-filter=ACDMRTUXB "${PARENT_COMMIT}" "${GITHUB_SHA}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")
          test -z "$(git status --porcelain=v1)"
          python build/python/202608271727-build-data-centres-intelligence.py doctor --root .

      - name: Run syntax and hostile semantic tests
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          set -euo pipefail
          python -m py_compile \
            build/python/202608271727-build-data-centres-intelligence.py \
            build/python/202608271727-verify-data-centres-intelligence.py \
            tests/test_202608271727_data_centres_intelligence.py
          python -m unittest -v tests/test_202608271727_data_centres_intelligence.py

      - name: Compile twice in isolation
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-build-data-centres-intelligence.py build \
            --root . \
            --output-root "${RUNNER_TEMP}/candidate-a" \
            --source-commit "${GITHUB_SHA}"
          python build/python/202608271727-build-data-centres-intelligence.py build \
            --root . \
            --output-root "${RUNNER_TEMP}/candidate-b" \
            --source-commit "${GITHUB_SHA}"

      - name: Independently verify both closures and byte parity
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root "${RUNNER_TEMP}/candidate-a" \
            --source-root . \
            --expected-source-commit "${GITHUB_SHA}"
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root "${RUNNER_TEMP}/candidate-b" \
            --source-root . \
            --expected-source-commit "${GITHUB_SHA}"
          python build/python/202608271727-verify-data-centres-intelligence.py compare \
            --left "${RUNNER_TEMP}/candidate-a" \
            --right "${RUNNER_TEMP}/candidate-b"

      - name: Replace only the complete touched partition and land closure
        shell: bash
        run: |
          set -euo pipefail
          python build/python/202608271727-build-data-centres-intelligence.py land \
            --candidate-root "${RUNNER_TEMP}/candidate-a" \
            --destination-root . \
            --source-commit "${GITHUB_SHA}"
          python build/python/202608271727-verify-data-centres-intelligence.py verify \
            --root . \
            --source-root . \
            --expected-source-commit "${GITHUB_SHA}"

      - name: Assert immutable output-only boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort)
          expected=(
            "data/intelligence/generation=202608271727/section=DATA_CENTRES/part-000.parquet"
            "exports/202608271727-pipelinenews-data-centres.json"
            "reports/202608271727-data-centres-intelligence-audit.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Commit quarantined immutable candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            data/intelligence/generation=202608271727/section=DATA_CENTRES/part-000.parquet \
            exports/202608271727-pipelinenews-data-centres.json \
            reports/202608271727-data-centres-intelligence-audit.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            "data/intelligence/generation=202608271727/section=DATA_CENTRES/part-000.parquet"
            "exports/202608271727-pipelinenews-data-centres.json"
            "reports/202608271727-data-centres-intelligence-audit.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-08-27T16:27:00Z"
          export GIT_COMMITTER_DATE="2026-08-27T16:27:00Z"
          git commit -m "202608271727: publish quarantined DATA_CENTRES intelligence candidate"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
